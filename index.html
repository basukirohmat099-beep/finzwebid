  <style>
    /* tahan tombol login / prompt login selama status login belum selesai dicek (anti-kedip saat refresh) */
    html.auth-pending #authActionBtn,html.auth-pending #profileLoginPrompt,html.auth-pending #chatLoginPrompt{visibility:hidden!important}
    /* English dipilih: sembunyikan sebentar sampai terjemahan selesai (anti-kedip bahasa) */
    html.lang-pending body{visibility:hidden}
  </style>
  <script>
  try{if(localStorage.getItem('finz_lang')==='en'){document.documentElement.classList.add('lang-pending');document.documentElement.setAttribute('lang','en')}}catch(e){}
  </script>
  <script>
  (function(){try{
    var has=Object.keys(localStorage).some(function(k){return /^sb-.+-auth-token$/.test(k)});
    if(!has)return;
    var h=document.documentElement;h.classList.add('auth-pending');
    var n=0,t=setInterval(function(){n++;
      var b=document.getElementById('authActionBtn');
      /* lepas penahan hanya setelah tombol login benar-benar disembunyikan (user terverifikasi), atau habis waktu */
      if((b&&b.classList.contains('hidden'))||n>40){h.classList.remove('auth-pending');clearInterval(t)}
    },100);
  }catch(e){}})();
  </script>
</head>
<body id="finzNeo" class="bg-white neo">

  <div id="appMount" role="application"></div>
  <script id="finzThemeColor">
  /* sinkronkan warna address-bar browser dengan tema aktif (siang/malam x mobile/desktop) */
  (function(){try{
    var m=document.querySelector('meta[name="theme-color"]');
    function u(){var d=document.body.classList.contains('bg-white'),w=matchMedia('(min-width:900px)').matches;
      m.setAttribute('content',d?(w?'#DCEBFF':'#FFF1C9'):(w?'#08141C':'#150F2A'));}
    new MutationObserver(u).observe(document.body,{attributes:true,attributeFilter:['class']});
    matchMedia('(min-width:900px)').addEventListener('change',u);u();
  }catch(e){}})();
  </script>
